<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #videoPlayer {
      width: 90vw;
      max-height: 75vh;
      object-fit: contain;
    }
    #camWrap {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 160px;
      height: 120px;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px #00000044;
      overflow: hidden;
      border-radius: 8px;
    }
    #cam, #canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    #tip {
      margin-top: 12px;
      font-size: 14px;
      color: #eee;
      text-align: center;
    }
  </style>
</head>
<body>
  <video id="videoPlayer" preload="auto" src="./rose.mp4"></video>

  <div id="camWrap">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="tip">点击画面启动｜手张开越大，花开越盛</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const videoPlayer = document.getElementById('videoPlayer');
    const camEl = document.getElementById('cam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let hands;
    let lastTargetTime = 0;

    // ========== 这里重点调！ ==========
    const bloomStart = 0;        // 花开片段起始时间（秒）
    const bloomEnd = 3.2;       // 完全盛开对应的视频时间（秒）
    const minOpen = 0.15;       // 判定“开始打开”的阈值
    const maxOpen = 0.45;       // 手到这个张开度 = 完全盛开
    // =================================

    function dist(p1, p2) {
      return Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
    }

    // 平滑过渡，防止画面疯狂抖动
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    let smoothBloom = 0;

    async function initHands() {
      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      hands.onResults((results) => {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        if (!results.multiHandLandmarks.length) return;
        const lm = results.multiHandLandmarks[0];

        const wrist = lm[0];
        const thumb = lm[4];
        const index = lm[8];
        const middle = lm[12];
        const ring = lm[16];
        const pinky = lm[20];

        // 五个指尖到手腕距离，取平均值代表手掌张开程度
        const dThumb = dist(thumb, wrist);
        const dIndex = dist(index, wrist);
        const dMiddle = dist(middle, wrist);
        const dRing = dist(ring, wrist);
        const dPinky = dist(pinky, wrist);

        const avgDist = (dThumb + dIndex + dMiddle + dRing + dPinky) / 5;

        // 映射： minOpen → 0；maxOpen → 1
        let rawBloom = (avgDist - minOpen) / (maxOpen - minOpen);
        rawBloom = Math.max(0, Math.min(1, rawBloom));

        // 平滑，防抖，不会跳帧
        smoothBloom = lerp(smoothBloom, rawBloom, 0.22);

        // 把花开进度映射到视频时间
        const targetTime = bloomStart + smoothBloom * (bloomEnd - bloomStart);

        // 只有变化足够大才更新视频，减少疯狂 seek
        if (Math.abs(targetTime - lastTargetTime) > 0.06) {
          videoPlayer.currentTime = targetTime;
          lastTargetTime = targetTime;
        }
      });

      const camera = new Camera(camEl, {
        onFrame: async () => {
          await hands.send({ image: camEl });
        },
        width: 640,
        height: 480
      });
      camera.start();
    }

    // 用户点击启动相机
    document.body.addEventListener('click', async () => {
      if (!hands) {
        await initHands();
      }
    }, { once: true });

    // 视频预加载，保证 seek 可用
    videoPlayer.addEventListener('loadedmetadata', () => {
      videoPlayer.pause();
      videoPlayer.currentTime = bloomStart;
    });
  </script>
</body>
</html>
