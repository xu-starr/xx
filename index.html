<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #videoPlayer {
      width: 90vw;
      max-height: 75vh;
      object-fit: contain;
    }
    #camWrap {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 160px;
      height: 120px;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px #00000044;
      overflow: hidden;
      border-radius: 8px;
    }
    #cam, #canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    #tip {
      margin-top: 12px;
      font-size: 14px;
      color: #eee;
      text-align: center;
    }
  </style>
</head>
<body>
  <video id="videoPlayer" preload="auto" src="./rose.mp4"></video>

  <div id="camWrap">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="tip">点击画面启动｜手停则花停，手越张花开越盛</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const videoPlayer = document.getElementById('videoPlayer');
    const camEl = document.getElementById('cam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let hands;

    // 视频花开区间
    const bloomStart = 0;
    const bloomEnd = 3.2;

    // 手掌开合检测区间
    const minOpen = 0.15;
    const maxOpen = 0.45;

    // 稳定判断：手张开角度多久没变，才算“停住”
    const stableFrames = 5;        // 连续多少帧变化很小才判定稳定
    const stableThreshold = 0.012; // 张开度变化小于这个值，视为没动

    // 当前花开进度 0~1
    let currentBloom = 0;

    // 上一帧的手掌张开度
    let lastOpenValue = null;
    let stableCount = 0;
    let isStable = false;

    function dist(p1, p2) {
      return Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
    }

    async function initHands() {
      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      hands.onResults((results) => {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        // 没检测到手，保持当前开度不动
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
          return;
        }

        const lm = results.multiHandLandmarks[0];

        const wrist = lm[0];
        const thumb = lm[4];
        const index = lm[8];
        const middle = lm[12];
        const ring = lm[16];
        const pinky = lm[20];

        const dThumb = dist(thumb, wrist);
        const dIndex = dist(index, wrist);
        const dMiddle = dist(middle, wrist);
        const dRing = dist(ring, wrist);
        const dPinky = dist(pinky, wrist);

        const avgDist = (dThumb + dIndex + dMiddle + dRing + dPinky) / 5;

        // 映射到 0~1
        let targetBloom = (avgDist - minOpen) / (maxOpen - minOpen);
        targetBloom = Math.max(0, Math.min(1, targetBloom));

        // 判断手是否稳定
        if (lastOpenValue !== null) {
          const diff = Math.abs(targetBloom - lastOpenValue);

          if (diff < stableThreshold) {
            stableCount++;

            // 连续稳定足够多帧后，锁住开度
            if (stableCount >= stableFrames) {
              isStable = true;
            }
          } else {
            // 手在动，解锁
            stableCount = 0;
            isStable = false;
          }
        }

        lastOpenValue = targetBloom;

        // 关键：手稳定不动时，花保持当前开度；手变化时才跟随
        if (!isStable) {
          currentBloom = targetBloom;
        }

        // 只在变化时更新视频帧，避免画面抖动
        const targetTime = bloomStart + currentBloom * (bloomEnd - bloomStart);

        if (Math.abs(targetTime - videoPlayer.currentTime) > 0.05) {
          videoPlayer.currentTime = targetTime;
        }
      });

      const camera = new Camera(camEl, {
        onFrame: async () => {
          await hands.send({ image: camEl });
        },
        width: 640,
        height: 480
      });

      camera.start();
    }

    // 点击页面启动摄像头和手势识别
    document.body.addEventListener('click', async () => {
      if (!hands) {
        await initHands();
      }
    }, { once: true });

    // 视频预加载后停在花苞位置
    videoPlayer.addEventListener('loadedmetadata', () => {
      videoPlayer.pause();
      videoPlayer.currentTime = bloomStart;
    });
  </script>
</body>
</html>
